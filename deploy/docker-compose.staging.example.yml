# Example compose for staging API + worker (Postgres externo).
# Run from repo root:
#   docker compose -f deploy/docker-compose.staging.example.yml up --build
# Point env_file at your secret-store copy of .env.staging.example.
# Does not start Postgres — use Neon/RDS/etc.
# docs/STAGING_API_DOCKER_V0_1.md

services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      PROCESS: api
      APP_ENV: sandbox
      LIVE_COMMERCE_ENABLED: 'false'
      DEMO_UI_ENABLED: 'false'
    env_file:
      - .env.staging
    ports:
      - '4000:4000'
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      PROCESS: worker
      APP_ENV: sandbox
      LIVE_COMMERCE_ENABLED: 'false'
      DEMO_UI_ENABLED: 'false'
    env_file:
      - .env.staging
    restart: unless-stopped
    depends_on:
      - api
